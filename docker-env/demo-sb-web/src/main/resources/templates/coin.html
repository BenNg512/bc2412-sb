<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://coin-images.coingecko.com/coins/images/1/large/bitcoin.png?1696501400" />
    <title>Cryptocurrency Market (designed by Ben Ng)</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .last-update {
            color: white;
            position: absolute; 
            top: 20px;
            right: 20px;
        }
        .italic-text {
            font-style: italic;
            color: #000;
            font-size: 12px;
        }
        .text-success {
            color: green;
        }
        .text-danger {
            color: red;
        }
        table {
            width: 100%;
            height: 100%;
            margin-top: 20px;
            background-color: rgba(255, 255, 255, 0.8);
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        h1 {
            color: rgb(255, 199, 56);
            scroll-padding: 20px;
            font-size: 40pt;
            padding: 20px;
            text-align: center;
        }
        html {
            height: 100%;
            margin: 0;
        }
        body {
            min-height: 100%;
            margin: 0;
        }
        .table-container {
            max-height: 500px;
            overflow-y: auto;
            width: 100%;
        }
        thead th {
            color: rgba(3, 0, 87);
            position: sticky;
            top: 0;
            z-index: 1;
            background-color: rgb(209, 255, 255);
        }
    </style>
</head>

<body style="background-image:url('https://img.freepik.com/premium-photo/bitcoin-coins-stacked-abstract-bluegray-background-with-financial-market-chart-cryptocurrency_1299685-27403.jpg'); 
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: scroll;">
    <div class="container">
        <h1 class="mt-5">Cryptocurrency Market</h1>
        <div class="last-update">Last Updated: <span th:text="${latestUpdate}"></span></div>
        <input type="text" id="filterInput" onkeyup="filterTable()" placeholder="Search for coins.." class="form-control mb-3">
        <div class="table-container">
            <table class="table table-striped mt-3">
                <thead>
                    <tr>
                        <th>Coin</th>
                        <th>Price</th>
                        <th>Price Change (24h)</th>
                        <th>Change Percentage (24h)</th>
                        <th>Market Cap</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="coin : ${coin}">
                        <td>
                            <img th:src="${coin.image}" alt="${coin.name} image" style="width: 50px; height: 50px;" />
                            <span style="color: #000; font-weight: bold;" th:text="${coin.name} + ' '"></span>
                            <span style="color: #5e5e5e;" th:text="${coin.symbol != null and coin.symbol != ''} ? ${#strings.toUpperCase(coin.symbol)} : ''"></span>
                            <br><span class="italic-text" th:text="${coin.lastUpdatedHKTime}"></span>
                        </td>
                        <td>$<span class="price" th:text="${coin.currentPrice}"></span></td>
                        <td class="price-change" th:text="${coin.priceChange24h}"></td>
                        <td th:text="${coin.priceChangePercentage24h > 0? '+' + coin.priceChangePercentage24h : coin.priceChangePercentage24h} + '%'" th:class="${coin.priceChangePercentage24h >= 0} ? 'text-success' : 'text-danger'"></td>
                        <td>$<span class="price" th:text="${coin.marketCap}"></span></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(coin)}">
                        <td colspan="5">No coins available</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="/js/script.js"></script>

</body>
</html>
