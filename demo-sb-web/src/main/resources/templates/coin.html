<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Market</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .text-success {
            color: green;
        }
        .text-danger {
            color: red;
        }
        table {
            width: 100%;
            height: 100%;
            margin-top: 20px;
            background-color: rgba(255, 255, 255, 0.8);
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        h1 {
            color: rgb(255, 225, 0);
            padding-left: 10px;
        }
        html {
            height: 100%;
            margin: 0;
        }
        body {
            min-height: 100%;
            margin: 0;
        }
        .table-container {
            max-height: 800px; /* Adjust this value as needed */
            overflow-y: auto; /* Enables vertical scrolling */
            width: 100%;
        }
        /* Optional: Sticky header */
        thead th {
            position: sticky;
            top: 0;
            z-index: 1; /* Keeps header above scrolling content */
            background-color: #f2f2f2; /* Ensures header background stays visible */
        }
    </style>
</head>
<body style="background-image:url('https://img.freepik.com/premium-photo/bitcoin-coins-stacked-abstract-bluegray-background-with-financial-market-chart-cryptocurrency_1299685-27403.jpg'); 
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: scroll;">
    <div class="container">
        <h1 class="mt-5">Coin Market</h1>
        <input type="text" id="filterInput" onkeyup="filterTable()" placeholder="Search for coins.." class="form-control mb-3">
        <div class="table-container">
            <table class="table table-striped mt-3">
                <thead>
                    <tr>
                        <th>Coin</th>
                        <th>Symbol</th>
                        <th>Price</th>
                        <th>Price Change (24h)</th>
                        <th>Change Percentage (24h)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="coin : ${coin}">
                        <td>
                            <img th:src="${coin.image}" alt="${coin.name} image" style="width: 50px; height: 50px;" />
                            <span th:text="${coin.name}"></span>
                        </td>
                        <td th:text="${coin.symbol}"></td>
                        <td th:text="${#numbers.formatDecimal(coin.currentPrice, 1, 4)}"></td>
                        <td th:text="${#numbers.formatDecimal(coin.priceChange24h, 1, 4)}" th:class="${coin.priceChange24h >= 0} ? 'text-success' : 'text-danger'"></td>
                        <td th:text="${#numbers.formatDecimal(coin.priceChangePercentage24h, 1, 4)}" th:class="${coin.priceChangePercentage24h >= 0} ? 'text-success' : 'text-danger'"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(coin)}">
                        <td colspan="5">No coins available</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        // Filter function to search for coins
        function filterTable() {
            var input, filter, table, tr, td, i, txtValue;
            input = document.getElementById('filterInput');
            filter = input.value.toUpperCase();
            table = document.querySelector('table');
            tr = table.getElementsByTagName('tr');

            for (i = 1; i < tr.length; i++) {
                td = tr[i].getElementsByTagName('td')[0]; // Check the coin name column
                if (td) {
                    txtValue = td.textContent || td.innerText;
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        tr[i].style.display = '';
                    } else {
                        tr[i].style.display = 'none';
                    }
                }
            }
        }
    </script>
</body>
</html>
