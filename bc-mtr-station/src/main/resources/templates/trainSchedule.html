<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Schedule</title>
    <style>
        body {
            background-image: url('https://cdn.i-scmp.com/sites/default/files/styles/1200x800/public/d8/images/2024/10/25/Key-Visual.jpg?itok=8FtCE1kv');
            background-size: cover; /* Ensures the image covers the entire viewport */
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed; /* Keeps the image fixed while scrolling */
            font-family: Arial, sans-serif;
        }
        table {
            width: 100%;
            background-color: rgba(252, 252, 252, 0.8);
            border-collapse: collapse;
            margin-top: 20px;
            color-scheme: dark;
        }
        th, td {
            border: 1px solid #ffffff 0%;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #bbf0ff;
        }
        .up {
            color: green;
        }
        .down {
            color: red;
        }
        h1 {
            text-align: center;
            color : rgb(6, 21, 96);
        }
        h2 {
            background-color: rgba(255, 255, 255, 0.5);
            text-align: center;
            padding-inline-end: 0%;
        }
        p {
            text-align: center;
        }
        .container {
            margin: 20px auto;
            max-width: 800px;
        }
        .no-data {
            font-style: italic;
            color: gray;
        }
        .last-updated {
            color: rgb(0, 0, 0);
            position: absolute; 
            top: 10px;
            right: 20px;
            font-size: 8pt;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HKMTR Train Schedule</h1>
        <div class="last-updated">Last Updated: <span th:text="${sysTime.substring(0, 19)}"></span></div>
        <div>
            <form id="mtr" action="/mtrstation/" method="GET">
                <label for="line">Line: </label>
                <select id="line" name="line" onchange="updateChart()">
                    <option th:each="line : ${lines}" 
                            th:value="${line.name()}" 
                            th:text="${line.nameEN}" 
                            th:selected="${selectedLine == line.name()}">
                    </option>
                </select>
                <label for="station" style = "margin-left: 10px;">Station: </label>
                <select id="station" name="station" onchange="updateChart()">
                    <option th:each="station : ${stations}" 
                            th:value="${station.station}" 
                            th:text="${station.nameEN} " 
                            th:selected="${selectedStation == station.station}">
                    </option>
                </select>
                <label style = "margin-left: 10px;">Is Delay: <span th:text="${isDelay}"></span></label>
            </form>
        </div>

        <!-- Up Line Section -->
        <h2 class="up">Up Line</h2>
        <table>
            <thead>
                <tr>
                    <th>Platform</th>
                    <th>Arrival Time</th>
                    <th>Departure Time</th>
                    <th>Destination</th>
                </tr>
            </thead>
            <tbody>
                <!-- Check if UP data is null or empty -->
                <tr th:if="${up == null || up.isEmpty()}">
                    <td colspan="5" class="no-data">No trains available for the Up line</td>
                </tr>
                <!-- Iterate over UP trains if available -->
                <tr th:each="train : ${up}">
                    <td th:text="${train.plat}"></td>
                    <td th:text="${train.ttnt} + ' Minutes'"></td>
                    <td th:text="${train.time.substring(11, 16)}"></td>
                    <td th:text="${train.dest}"></td>
                </tr>
            </tbody>
        </table>

        <!-- Down Line Section -->
        <h2 class="down">Down Line</h2>
        <table>
            <thead>
                <tr>
                    <th>Platform</th>
                    <th>Arrival Time</th>
                    <th>Departure Time</th>
                    <th>Destination</th>
                </tr>
            </thead>
            <tbody>
                <!-- Check if DOWN data is null or empty -->
                <tr th:if="${down == null || down.isEmpty()}">
                    <td colspan="5" class="no-data">No trains available for the Down line</td>
                </tr>
                <!-- Iterate over DOWN trains if available -->
                <tr th:each="train : ${down}">
                    <td th:text="${train.plat}"></td>
                    <td th:text="${train.ttnt} + ' Minutes'"></td>
                    <td th:text="${train.time.substring(11, 16)}"></td>
                    <td th:text="${train.dest}"></td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        function updateChart() {
            const line = document.getElementById('line').value;
            const station = document.getElementById('station').value;
            window.location.href = `/hk-mtr-station/${line}/${station}`;
        }
    </script>
</body>
</html>
