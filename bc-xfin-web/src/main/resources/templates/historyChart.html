<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Stock Price Candlestick Chart</title>
    <link rel="icon" href="https://coin-images.coingecko.com/coins/images/1/large/bitcoin.png?1696501400" />
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        .error { color: red; }
        #chartContainer { width: 80%; height: 600px; margin: auto; }
    </style>
</head>
<body>
    <div>
        <form id="stockForm" action="/history/chart" method="GET">
            <label for="symbol">Symbol: </label>
            <select id="symbol" name="symbol" onchange="updateChart()">
                <option value="0001.HK" th:selected="${symbol == '0001.HK'}">0001.HK</option>
                <option value="0002.HK" th:selected="${symbol == '0002.HK'}">0002.HK</option>
                <option value="0003.HK" th:selected="${symbol == '0003.HK'}">0003.HK</option>
                <option value="0004.HK" th:selected="${symbol == '0004.HK'}">0004.HK</option>
                <option value="0005.HK" th:selected="${symbol == '0005.HK'}">0005.HK</option>
                <option value="BTC-USD" th:selected="${symbol == 'BTC-USD'}">BTC-USD</option>
            </select>

            <label for="start">Start Date: </label>
            <input type="date" id="start" name="start" th:value="${start}" onchange="updateChart()">

            <label for="end">End Date: </label>
            <input type="date" id="end" name="end" th:value="${end}" onchange="updateChart()">

            <label for="interval">Interval: </label>
            <select id="interval" name="interval" onchange="updateChart()">
                <option value="1d" th:selected="${interval == '1d'}">Daily</option>
                <option value="5d" th:selected="${interval == '5d'}">5 Days</option>
                <option value="1mo" th:selected="${interval == '1mo'}">1 Month</option>
            </select>

            <!-- <button type="submit">Update Chart</button> -->
        </form>
    </div>
    <div>
        <p>Last Update: <span th:text="${lastUpdated} ?: 'null'"></span></p>
    </div>

    <h1 id="chartTitle">Loading...</h1>
    <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>
    <div id="chartContainer"></div>

    <!-- <div>
        <h3>Raw stockDataJson</h3>
        <pre th:text="${stockDataJson}"></pre>
    </div> -->

    <script th:inline="javascript">
        const stockDataJson = /*[[${stockDataJson}]]*/ '[]';
        console.log("Raw stockDataJson: ", stockDataJson);

        let stockData = [];
        try {
            stockData = JSON.parse(stockDataJson);
            console.log("Parsed stockData: ", stockData);
        } catch (e) {
            console.error("Error parsing stockDataJson: ", e);
        }

        const titleElement = document.getElementById('chartTitle');
        if (stockData.length > 0) {
            titleElement.textContent = 'Stock Price Chart for ' + stockData[0].symbol;
            console.log("Title set to: ", titleElement.textContent);
        } else {
            titleElement.textContent = 'No Data Available';
            console.log("No data, title set to: ", titleElement.textContent);
        }

        if (stockData.length > 0) {
            const chartData = stockData.map((data, index) => {
                const candle = {
                    time: data.timestamp, // lightweight-charts expects Unix timestamp in seconds
                    open: Number(data.open),
                    high: Number(data.high),
                    low: Number(data.low),
                    close: Number(data.close)
                };
                console.log(`Candle ${index}: `, candle);
                return candle;
            });

            const chartContainer = document.getElementById('chartContainer');
            const chart = LightweightCharts.createChart(chartContainer, {
                width: chartContainer.clientWidth,
                height: 600,
                layout: {
                    background: { color: '#222' }, // Dark background like the example
                    textColor: '#DDD' // Light text
                },
                grid: {
                    vertLines: { color: '#444' },
                    horzLines: { color: '#444' }
                },
                timeScale: {
                    timeVisible: true,
                    secondsVisible: false
                }
            });

            const candlestickSeries = chart.addCandlestickSeries({
                upColor: '#00ff1f', // Green for up days
                downColor: '#ff0000', // Red for down days
                borderVisible: false,
                wickUpColor: '#00ff1f',
                wickDownColor: '#ff0000'
            });

            candlestickSeries.setData(chartData);
            console.log("Candlestick chart initialized with data: ", chartData);

            // Auto-resize chart on window resize
            window.addEventListener('resize', () => {
                chart.resize(chartContainer.clientWidth, 600);
            });

            // Adjust time scale to fit data
            chart.timeScale().fitContent();
        } else {
            console.log("No data to display in chart");
        }

        initializeChart(stockData);

        function updateChart() {
            const symbol = document.getElementById('symbol').value;
            const start = document.getElementById('start').value;
            const end = document.getElementById('end').value;
            const interval = document.getElementById('interval').value;

            const startTimestamp = Math.floor((new Date(start).getTime() / 1000) < 0 ? 0:(new Date(start).getTime() / 1000));
            const endTimestamp = Math.floor(new Date(end).getTime() / 1000);

            window.location.href = `/history/chart/${symbol}?start=${startTimestamp}&end=${endTimestamp}&interval=${interval}`;
        }
    </script>
</body>
</html>
