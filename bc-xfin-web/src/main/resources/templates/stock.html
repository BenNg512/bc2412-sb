<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="refresh" content="10">
    <link rel="icon" href="https://coin-images.coingecko.com/coins/images/1/large/bitcoin.png?1696501400" />
    <title>Stock Price Graph</title>
    <!-- Include Chart.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        canvas {
            width: 90%;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <h1 th:text="${title} + ' on ' + ${date}">Stock Price</h1>
    <p>Next refresh: <span id="timer">10</span> seconds</p>
    <!-- Canvas for the chart -->
    <canvas id="stockChart"></canvas>

    <!-- Pass data from Thymeleaf to JavaScript -->
    <script th:inline="javascript">
        // Extract data from Thymeleaf model
        const stockData = /*[[${stockData}]]*/ [];

        // Prepare labels (marketTime) and prices (regularMarketPrice)
        const labels = stockData.map(entry => entry.marketTime.substring(11, 16)); // HH:MM
        const prices = stockData.map(entry => entry.regularMarketPrice);

        // Calculate 5-period Simple Moving Average (SMA)
        const period = 30; // 5 periods (25 minutes for 5-min data)
        const smaData = stockData.map((entry, index) => {
            if (index < period - 1) {
                return null; // Not enough data for SMA yet
            }
            // Sum the last 'period' prices and divide by period
            const pricesSlice = stockData.slice(index - (period - 1), index + 1).map(e => e.regularMarketPrice);
            const sum = pricesSlice.reduce((acc, val) => acc + val, 0);
            return sum / period;
        });

        // Align SMA data with labels
        const smaDataset = labels.map((label, index) => ({
            x: label,
            y: smaData[index]
        }));

        // Create the chart
        const ctx = document.getElementById('stockChart').getContext('2d');
        new Chart(ctx, {
            type: 'line', // Line graph
            data: {
                labels: labels, // X-axis: time (HH:MM)
                datasets: [
                    {
                        label: 'Stock Price (HKD)',
                        data: prices, // Y-axis: price
                        borderColor: 'blue',
                        backgroundColor: 'rgba(0, 0, 255, 0.1)',
                        fill: true,
                        tension: 0.1
                    },
                    {
                        label: '5-Period SMA',
                        data: smaDataset,
                        borderColor: 'orange',
                        borderWidth: 2,
                        fill: false,
                        pointRadius: 0, // No points, just a line
                        tension: 0.1
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        title: { display: true, text: 'Time (HH:MM)' }
                    },
                    y: {
                        title: { display: true, text: 'Price (HKD)' },
                        beginAtZero: false
                    }
                }
            }
        });
    </script>

    <!-- Load the timer JavaScript -->
    <script src="/js/script.js"></script>
</body>
</html>
