<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="30">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="@{/img/bitcoin.png}" />
    <title>Cryptocurrency Market (designed by Ben Ng)</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}">
    <style>
.last-update {
  color: rgb(0, 0, 0);
  position: absolute; 
  top: 10px;
  right: 20px;
  font-size: 10pt;
  padding: 4px 10px;
  background-color: rgba(199, 255, 255, 0.8);
  border-radius: 8px;
}
.version {
  color: rgb(122, 246, 255); 
  bottom: 40px;
  right: 20px;
  font-size: 10pt;
}
.italic-text {
  font-style: italic;
  color: #868585;
  font-size: 12px;
}
.text-success {
  color: green;
}
.text-danger {
  color: red;
}
table {
  width: auto;
  height: 80vh;
  margin-top: 20px;
  overflow-y: auto;
  background-color: rgba(255, 255, 255, 0.8);
}
th, td {
  padding: 10px;
  text-align: left;
  border-bottom: 1px solid #ddd;
}
th {
  background-color: #f2f2f2;
}
h1 {
  color: rgb(255, 199, 56);
  scroll-padding: 20px;
  font-size: 40pt;
  padding: 20px;
  text-align: center;
}
html {
  height: 100%;
  margin: 0;
}
body {
  min-height: 100%;
  margin: 0;
}
.table-container {
  max-height: 500px;
  overflow-y: auto;
  width: 100%;
}
thead th {
  color: rgb(4, 0, 112);
  position: sticky;
  top: 0;
  z-index: 1;
  background-color: rgb(180, 251, 251);
}

    </style>
</head>

<body style="background-image:url('https://img.freepik.com/premium-photo/bitcoin-coins-stacked-abstract-bluegray-background-with-financial-market-chart-cryptocurrency_1299685-27403.jpg'); 
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: scroll;
            max-height: 100vh;">
    <div class="container">
        <h1 class="mt-5">Cryptocurrency Market</h1>
        <div class="last-update">
          <div>Data Last Updated from Coingecko api:</div>
          <div th:text="${latestUpdate}"></div>
          <div><span id="timer">30</span> seconds until next refresh</div>
        </div>
        
        <input type="text" id="filterInput" onkeyup="filterTable()" placeholder="Search for coins.." class="form-control mb-3">
        <div class="table-container">
            <table class="table table-striped mt-3" id="coinTable">
                <thead>
                    <tr>
                        <th>Coin</th>
                        <th>Price (USD)</th>
                        <th>Price Change (24h)</th>
                        <th>Change Percentage (24h)</th>
                        <th>Market Cap (USD)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="coin : ${coin}">
                        <td>
                            <img th:src="${coin.image}" alt="${coin.name} image" style="width: 50px; height: 50px;" />
                            <span style="color: #000000; font-weight: bold;" th:text="${coin.name} + ' '"></span>
                            <span style="color: #676767;" th:text="${coin.symbol != null and coin.symbol != ''} ? ${#strings.toUpperCase(coin.symbol)} : ''"></span>
                            <br><span class="italic-text" th:text="${coin.lastUpdatedHKTime}"></span>
                        </td>
                        <td>$<span th:class="price" th:text="${coin.currentPrice}"></span></td>
                        <td th:class="price-change" th:text="${coin.priceChange24h}"></td>
                        <td th:class="percentage-change" th:text="${coin.priceChangePercentage24h}"></td>
                        <td>$<span th:class="price" th:text="${coin.marketCap}"></span></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(coin)}">
                        <td colspan="5">No coins available</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <br>
        <div class="version"><span>*Version last updated on 11th, Sep 2025</span></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
    function filterTable() {
        var input = document.getElementById("filterInput");
        var filter = input.value.toLowerCase();
        var table = document.getElementById("coinTable");
        var trs = table.getElementsByTagName("tr");
        for (var i = 1; i < trs.length; i++) { // skip header row
            var td = trs[i].getElementsByTagName("td")[0];
            if (td) {
                var txtValue = td.textContent || td.innerText;
                if (txtValue.toLowerCase().indexOf(filter) > -1) {
                    trs[i].style.display = "";
                } else {
                    trs[i].style.display = "none";
                }
            }
        }
    }
    </script>
    <script src="/js/script.js"></script>
</body>
</html>
